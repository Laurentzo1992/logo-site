# Déploiement sur le VPS dédié (139.99.209.66). Le HTTPS est assuré par le
# Caddy partagé du serveur (deploy/caddy/, installé dans /opt/caddy), qui sert
# aussi les autres plateformes : "web" rejoint son réseau externe "proxy" sous
# l'alias "logo-site-web". Aucun port n'est exposé par ce projet.
#
# Usage sur le VPS :
#   docker compose -f docker-compose.standalone.yml up -d --build
#
# Pour l'ancien VPS partagé (Caddy de kbot), voir docker-compose.prod.yml.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logosite}
      POSTGRES_USER: ${DB_USER:-logosite}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logosite} -d ${DB_NAME:-logosite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/static
      - media_data:/app/logosite/static/images
    networks:
      default:
      proxy:
        aliases:
          - logo-site-web

  cron:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      FETCH_NEWS_INTERVAL_SECONDS: ${FETCH_NEWS_INTERVAL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/app/cron_entrypoint.sh"]
    command: []

networks:
  default:
  proxy:
    external: true

volumes:
  postgres_data:
  static_data:
  media_data:
