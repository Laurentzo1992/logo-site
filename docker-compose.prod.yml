# Ce VPS a déjà un Caddy partagé (projet /opt/kbot/, réseau "kbbot_backend")
# qui sert plusieurs sites (kbot, oser-bf.org, mentorat_site...). On ne lance
# donc PAS notre propre Caddy ici — "web" rejoint ce réseau partagé pour être
# joignable par ce Caddy existant, en plus de notre propre réseau (pour
# parler à "db"). Voir /opt/kbot/Caddyfile pour la configuration du domaine.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-logosite}
      POSTGRES_USER: ${DB_USER:-logosite}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logosite} -d ${DB_NAME:-logosite}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Pas de "ports:" ici volontairement : la base ne doit pas être joignable
    # depuis l'extérieur du serveur, seulement par les autres conteneurs.

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/static
      - media_data:/app/logosite/static/images
    networks:
      default:
      kbbot_backend:
        aliases:
          - logo-site-web

  cron:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      FETCH_NEWS_INTERVAL_SECONDS: ${FETCH_NEWS_INTERVAL_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/app/cron_entrypoint.sh"]
    command: []

networks:
  default:
  kbbot_backend:
    external: true

volumes:
  postgres_data:
  static_data:
  media_data:
